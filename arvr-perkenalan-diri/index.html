<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum AR/VR - Pertemuan 1</title>

  <!-- A-Frame versi 1.7.1 sesuai instruksi praktikum. -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <style>
    body { margin: 0; font-family: Arial, sans-serif; }
    .petunjuk {
      position: fixed; z-index: 10; top: 16px; left: 16px;
      max-width: 310px; padding: 14px 17px;
      color: #1b3551; background: rgba(255, 255, 255, 0.92);
      border-radius: 14px; box-shadow: 0 8px 28px #1e44661f;
      line-height: 1.5; pointer-events: none;
    }
    .petunjuk strong { display: block; font-size: 16px; }
    .petunjuk span { font-size: 13px; }
    @media (max-width: 600px) {
      .petunjuk { top: 10px; left: 10px; right: 10px; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="petunjuk">
    <strong>Praktikum AR/VR - Pertemuan 1</strong>
    <span id="pesan">Geser layar untuk melihat sekitar. Arahkan titik tengah ke kotak dan klik untuk mengganti warnanya.</span>
  </div>

  <!-- Halaman utama: scene WebXR berbasis A-Frame -->
  <a-scene background="color: #D6F1FF" shadow="type: pcfsoft">

    <!-- Cahaya -->
    <a-light type="ambient" color="#FFFFFF" intensity="0.9"></a-light>
    <a-light type="directional" position="-3 7 4" intensity="0.85" castShadow="true"></a-light>

    <!-- Langit dan lantai -->
    <a-sky color="#A8DDF5"></a-sky>
    <a-plane position="0 0 -3" rotation="-90 0 0" width="22" height="22"
             color="#8FC7AD" shadow="receive: true"></a-plane>

    <!-- Judul di ruang 3D -->
    <a-text value="SELAMAT DATANG DI AR/VR" position="0 3.05 -3.4" width="6.5"
            color="#193653" align="center" anchor="center"></a-text>
    <a-text value="Contoh scene A-Frame 1.7.1" position="0 2.67 -3.4" width="4.6"
            color="#28516F" align="center" anchor="center"></a-text>

    <!-- 3 objek 3D contoh -->
    <a-box id="kotak" class="interaktif" position="-1.8 1 -3"
           width="1.3" height="1.3" depth="1.3" rotation="0 25 0"
           color="#695CF3" shadow="cast: true"
           animation="property: rotation; to: 0 385 0; dur: 9000; loop: true; easing: linear"></a-box>

    <a-sphere position="0 1.05 -3" radius="0.86"
              color="#FFB547" shadow="cast: true"></a-sphere>

    <a-cylinder position="1.9 0.95 -3" radius="0.64" height="1.9"
                color="#36B7BC" shadow="cast: true"></a-cylinder>

    <!-- Label tiap objek -->
    <a-text value="BOX" position="-1.8 0.12 -1.95" rotation="-75 0 0"
            align="center" width="2.6" color="#173B43"></a-text>
    <a-text value="SPHERE" position="0 0.12 -1.95" rotation="-75 0 0"
            align="center" width="2.6" color="#173B43"></a-text>
    <a-text value="CYLINDER" position="1.9 0.12 -1.95" rotation="-75 0 0"
            align="center" width="2.6" color="#173B43"></a-text>

    <!-- Kamera + kursor untuk interaksi sederhana -->
    <a-entity camera look-controls position="0 1.6 5">
      <a-cursor color="#FFFFFF" raycaster="objects: .interaktif"
                fuse="false"></a-cursor>
    </a-entity>
  </a-scene>

  <!-- Skrip JS terpisah, sesuai struktur pada soal -->
  <script src="js/main.js"></script>
</body>
</html>
